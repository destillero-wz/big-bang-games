<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Bang Jeopardy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1024;
    --bg2: #1a1f45;
    --panel: rgba(255,255,255,0.06);
    --line: rgba(255,255,255,0.12);
    --text: #f3f4ff;
    --muted: #a3a8d6;
    --accent: #ffb703;
    --tile: #1d2a8a;
    --tile-hi: #2638b3;
    --tile-used: #151a3d;
    --good: #22c55e;
    --bad: #f43f5e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Inter, system-ui, sans-serif; color: var(--text);
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg) 70%) fixed, var(--bg);
  }
  .hidden { display: none !important; }
  button {
    font: inherit; font-weight: 600; font-size: 16px; border: 0; border-radius: 10px; padding: 10px 16px;
    background: var(--accent); color: #1b1d3a; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.ghost:hover { border-color: var(--accent); }
  button.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  input, textarea {
    font: inherit; font-size: 15px; width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: rgba(0,0,0,0.25); color: var(--text); outline: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 54px; }

  /* ---------- Board ---------- */
  #boardView { display: flex; flex-direction: column; height: 100vh; padding: 16px; gap: 12px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .topbar h1 { margin: 0; font-size: clamp(22px, 3vw, 36px); font-weight: 800; letter-spacing: -0.02em; }
  .topbar h1 span { color: var(--accent); }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .board { flex: 1; display: grid; gap: 8px; min-height: 0; }
  .cat {
    background: var(--tile); border-radius: 10px; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 8px; font-weight: 800; text-transform: uppercase; font-size: clamp(14px, 2vw, 26px);
    letter-spacing: 0.02em; border-bottom: 4px solid var(--accent);
  }
  .cell {
    background: var(--tile); border-radius: 10px; display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-weight: 800; font-size: clamp(24px, 4.5vw, 64px); cursor: pointer; border: 0;
    text-shadow: 0 3px 0 rgba(0,0,0,0.4); transition: background 0.15s, transform 0.1s; padding: 0;
  }
  .cell:hover { background: var(--tile-hi); transform: scale(1.02); }
  .cell.used { background: var(--tile-used); color: transparent; text-shadow: none; }
  .cell.used:hover { color: rgba(255,255,255,0.15); transform: none; }
  .scorestrip { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .scorestrip span { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; }
  .scorestrip b { color: var(--accent); margin-left: 6px; }

  /* ---------- Clue ---------- */
  #clueView { position: fixed; inset: 0; background: var(--tile); display: flex; flex-direction: column; padding: 24px; z-index: 5; }
  .clue-head { display: flex; justify-content: space-between; align-items: center; font-size: clamp(16px, 2vw, 26px); font-weight: 800; text-transform: uppercase; }
  .clue-head .val { color: var(--accent); }
  .clue-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 28px; padding: 16px; }
  .question { font-size: clamp(26px, 4.6vw, 64px); font-weight: 800; line-height: 1.2; max-width: 1200px; text-transform: uppercase; text-shadow: 0 3px 0 rgba(0,0,0,0.35); }
  .clue-img { max-height: 48vh; max-width: min(80vw, 900px); object-fit: contain; filter: drop-shadow(0 6px 0 rgba(0,0,0,0.35)); }
  .clue-body.has-img .question { font-size: clamp(22px, 3.4vw, 44px); }
  select {
    font: inherit; font-size: 15px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg2); color: var(--text);
  }
  .answer { font-size: clamp(22px, 3.6vw, 48px); font-weight: 800; color: var(--accent); }
  .dd { font-size: clamp(48px, 10vw, 140px); font-weight: 800; color: var(--accent); text-shadow: 0 6px 0 rgba(0,0,0,0.4); animation: pop 0.6s ease-out; }
  @keyframes pop { from { transform: scale(0.3) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  .clue-foot { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .award { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .award .label { color: var(--muted); margin-right: 4px; }
  .award button { background: rgba(255,255,255,0.12); color: var(--text); }
  .award button:hover { background: var(--good); }
  .award button.minus:hover { background: var(--bad); }
  .clue-actions { display: flex; gap: 10px; }
  .hint { color: var(--muted); font-size: 13px; }

  /* ---------- Panels (scores, editor) ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(5,7,20,0.85); z-index: 10; overflow-y: auto; padding: 24px 16px; }
  .panel { max-width: 1100px; margin: 0 auto; background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .panel h2 { margin: 0 0 4px; }
  .panel p { color: var(--muted); margin: 0 0 16px; }
  .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }

  .players { list-style: none; padding: 0; margin: 0 0 16px; }
  .players li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 22px; }
  .players li .rank { width: 32px; color: var(--muted); font-weight: 800; }
  .players li .name { flex: 1; font-weight: 600; }
  .players li .pts { font-weight: 800; color: var(--accent); min-width: 80px; text-align: right; }
  .players li button { padding: 6px 10px; font-size: 14px; }

  .ed-meta { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; margin-bottom: 16px; }
  .ed-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .ed-cat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .ed-cat > input { font-weight: 800; text-transform: uppercase; margin-bottom: 10px; }
  .ed-clue { border-top: 1px solid var(--line); padding: 10px 0 4px; }
  .ed-clue .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .ed-clue .top b { color: var(--accent); }
  .ed-clue label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .ed-clue label input { width: auto; }
  .ed-clue textarea { margin-bottom: 6px; }
  .ed-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; margin-top: 16px; }
  .ed-actions > div { display: flex; gap: 8px; flex-wrap: wrap; }
  .msg { color: var(--good); font-weight: 600; min-height: 20px; margin-top: 8px; }
</style>
</head>
<body>

<!-- ============ BOARD ============ -->
<section id="boardView">
  <div class="topbar">
    <h1 id="gameTitle"></h1>
    <div class="tools">
      <button class="ghost" id="scoresBtn">🏆 Scores</button>
      <button class="ghost" id="editBtn">✏️ Edit questions</button>
      <button class="ghost" id="resetBoardBtn">↺ Reset board</button>
    </div>
  </div>
  <div class="board" id="board"></div>
  <div class="scorestrip" id="scoreStrip"></div>
</section>

<!-- ============ CLUE ============ -->
<section id="clueView" class="hidden">
  <div class="clue-head"><span id="clueCat"></span><span class="val" id="clueVal"></span></div>
  <div class="clue-body">
    <div class="dd hidden" id="ddSplash">DAILY DOUBLE!</div>
    <img class="clue-img hidden" id="clueImg" alt="Picture for this question">
    <div class="question hidden" id="clueQ"></div>
    <div class="answer hidden" id="clueA"></div>
  </div>
  <div class="clue-foot">
    <div class="award hidden" id="award"></div>
    <div class="clue-actions">
      <button id="nextBtn">Reveal answer</button>
      <button class="ghost" id="backBtn">Back to board</button>
    </div>
    <div class="hint">Space = next step · Esc = back to board</div>
  </div>
</section>

<!-- ============ SCORES ============ -->
<div class="overlay hidden" id="scoresView">
  <div class="panel" style="max-width:640px">
    <div class="panel-head">
      <div><h2>🏆 Scores</h2><p>Add players here. After each answer you can award the points with one click.</p></div>
      <button class="ghost" id="scoresClose">Close</button>
    </div>
    <ol class="players" id="playerList"></ol>
    <div class="row">
      <input id="newPlayer" placeholder="Player name" maxlength="30">
      <button id="addPlayerBtn" style="white-space:nowrap">Add player</button>
    </div>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <label class="hint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="showStrip" style="width:auto"> Show scores under the board</label>
      <button class="danger" id="resetScoresBtn">Reset all scores to 0</button>
    </div>
  </div>
</div>

<!-- ============ EDITOR ============ -->
<div class="overlay hidden" id="editView">
  <div class="panel">
    <div class="panel-head">
      <div><h2>✏️ Edit questions</h2><p>Changes are saved in this browser. Use <b>Download</b> to keep a copy or move it to another computer.</p></div>
      <button class="ghost" id="editClose">Cancel</button>
    </div>
    <div class="ed-meta">
      <div><label class="hint" for="edTitle">Game title</label><input id="edTitle" maxlength="60"></div>
      <button class="ghost" id="randomDdBtn">🎲 Random Daily Double</button>
    </div>
    <div class="ed-grid" id="edGrid"></div>
    <div class="ed-actions">
      <div>
        <button class="ghost" id="exportBtn">⬇ Download questions file</button>
        <button class="ghost" id="importBtn">⬆ Load questions file</button>
        <input type="file" id="importFile" accept=".json,application/json" class="hidden">
        <select id="setSel" aria-label="Ready-made question set"></select>
        <button class="ghost" id="sampleBtn">Load ready-made set</button>
      </div>
      <div><button id="saveBtn">Save questions</button></div>
    </div>
    <div class="msg" id="edMsg"></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const VALUES = [100, 200, 300, 400, 500];
  const N_CATS = 4;

  // ---------- Ready-made question sets (original, written for the team) ----------
  const SAMPLE = {
    title: 'Big Bang Jeopardy',
    dailyDouble: { c: 2, r: 3 },
    categories: [
      { name: '2026 in Review', clues: [
        { q: 'This country won the 2026 FIFA World Cup, beating Argentina 1-0 in the final.', a: 'Spain' },
        { q: 'In July 2026, Tadej Pogačar won this famous cycling race for a record-equalling fifth time.', a: 'The Tour de France' },
        { q: 'This country topped the 2026 Winter Olympics medal table with a record 18 gold medals.', a: 'Norway' },
        { q: 'On Artemis II in April 2026, Jeremy Hansen became the first person from this country to travel around the Moon.', a: 'Canada' },
        { q: 'Dara\'s song "Bangaranga" won Eurovision 2026, giving this country its first ever win.', a: 'Bulgaria' } ] },
      { name: 'Screen & Sound 2026', clues: [
        { q: 'This web-slinging superhero\'s film "Brand New Day" is the biggest box office hit of 2026.', a: 'Spider-Man' },
        { q: 'Woody and Buzz returned in summer 2026 in the fifth film of this Pixar series.', a: 'Toy Story' },
        { q: '"The Odyssey", one of 2026\'s biggest films, is based on an epic poem by this ancient Greek poet.', a: 'Homer' },
        { q: 'This Puerto Rican star won the 2026 Grammy for Album of the Year, the first ever for a Spanish-language album.', a: 'Bad Bunny' },
        { q: 'Jessie Buckley won the 2026 Oscar for Best Actress, the first winner in that category from this country.', a: 'Ireland' } ] },
      { name: 'Name That Country', clues: [
        { q: 'Name this country.', a: 'Italy', img: 'img/italy.svg' },
        { q: 'Name this country.', a: 'Chile', img: 'img/chile.svg' },
        { q: 'Name this country.', a: 'Greece', img: 'img/greece.svg' },
        { q: 'Name this country.', a: 'Vietnam', img: 'img/vietnam.svg' },
        { q: 'Name this country.', a: 'Madagascar', img: 'img/madagascar.svg' } ] },
      { name: 'Rhyme Time', clues: [
        { q: 'A large swine.', a: 'Big pig' },
        { q: 'An overweight feline.', a: 'Fat cat' },
        { q: 'A small rodent\'s home.', a: 'Mouse house' },
        { q: 'A hilarious rabbit.', a: 'Funny bunny' },
        { q: 'A story about a giant sea mammal.', a: 'Whale tale' } ] }
    ]
  };
  const GENERAL = {
    title: 'Big Bang Jeopardy',
    dailyDouble: { c: 2, r: 3 },
    categories: [
      { name: 'Around the World', clues: [
        { q: 'This is the capital city of Australia.', a: 'Canberra' },
        { q: 'The Colosseum stands in this city.', a: 'Rome' },
        { q: 'This is the longest river in South America.', a: 'The Amazon' },
        { q: 'Lake Titicaca sits on the border between Peru and this country.', a: 'Bolivia' },
        { q: 'With more than 200,000 islands, this European country has more islands than any other nation.', a: 'Sweden' } ] },
      { name: 'Food & Drink', clues: [
        { q: 'Guacamole is made mainly from this fruit.', a: 'Avocado' },
        { q: 'This Italian dessert\'s name translates as "pick me up".', a: 'Tiramisu' },
        { q: 'Paella originally comes from this Spanish city and region.', a: 'Valencia' },
        { q: 'Taken from the crocus flower, this is the most expensive spice in the world by weight.', a: 'Saffron' },
        { q: 'This country is the world\'s biggest producer of coffee.', a: 'Brazil' } ] },
      { name: 'Science & Nature', clues: [
        { q: 'This planet is known as the Red Planet.', a: 'Mars' },
        { q: 'This is the largest organ of the human body.', a: 'The skin' },
        { q: 'This precious metal has the chemical symbol Au.', a: 'Gold' },
        { q: 'An octopus has this many hearts.', a: 'Three' },
        { q: 'This gas makes up about 78% of the air we breathe.', a: 'Nitrogen' } ] },
      { name: 'Music & Film', clues: [
        { q: 'This boy wizard goes to Hogwarts School of Witchcraft and Wizardry.', a: 'Harry Potter' },
        { q: 'This band released "Bohemian Rhapsody" in 1975.', a: 'Queen' },
        { q: '"Hips Don\'t Lie" singer Shakira comes from this country.', a: 'Colombia' },
        { q: 'This 1997 film about a sinking ship won 11 Oscars.', a: 'Titanic' },
        { q: 'Beethoven completed this many symphonies.', a: 'Nine' } ] }
    ]
  };
  const SETS = [
    { name: '2026 in Review, Name That Country, Rhyme Time', data: SAMPLE },
    { name: 'General knowledge', data: GENERAL }
  ];

  const clone = o => JSON.parse(JSON.stringify(o));
  let game = store.get('bbj-game') || clone(SAMPLE);
  let used = new Set(store.get('bbj-used') || []);
  let players = store.get('bbj-players') || [];
  let showStrip = store.get('bbj-strip') ?? true;
  const saveUsed = () => store.set('bbj-used', [...used]);
  const savePlayers = () => store.set('bbj-players', players);

  const isDD = (c, r) => game.dailyDouble && game.dailyDouble.c === c && game.dailyDouble.r === r;

  // ---------- Board ----------
  function renderBoard() {
    $('gameTitle').innerHTML = '';
    const words = (game.title || 'Big Bang Jeopardy').split(' ');
    const last = words.pop();
    $('gameTitle').append(words.join(' ') + ' ');
    const sp = document.createElement('span'); sp.textContent = last; $('gameTitle').append(sp);
    document.title = game.title || 'Big Bang Jeopardy';

    const b = $('board');
    b.innerHTML = '';
    b.style.gridTemplateColumns = `repeat(${game.categories.length}, 1fr)`;
    b.style.gridTemplateRows = `minmax(60px, 0.8fr) repeat(${VALUES.length}, 1fr)`;
    game.categories.forEach(cat => {
      const h = document.createElement('div'); h.className = 'cat'; h.textContent = cat.name; b.appendChild(h);
    });
    VALUES.forEach((v, r) => game.categories.forEach((cat, c) => {
      const cell = document.createElement('button');
      const key = c + '-' + r;
      cell.className = 'cell' + (used.has(key) ? ' used' : '');
      cell.textContent = v;
      cell.setAttribute('aria-label', `${cat.name} for ${v}${used.has(key) ? ' (used)' : ''}`);
      cell.onclick = () => openClue(c, r);
      b.appendChild(cell);
    }));
    renderStrip();
  }
  function renderStrip() {
    const s = $('scoreStrip'); s.innerHTML = '';
    if (!showStrip || !players.length) return;
    sortedPlayers().forEach(p => {
      const el = document.createElement('span'); el.textContent = p.name;
      const b = document.createElement('b'); b.textContent = p.score; el.appendChild(b); s.appendChild(el);
    });
  }
  const sortedPlayers = () => players.slice().sort((a, b) => b.score - a.score);

  // ---------- Clue flow: (daily double) → question → answer ----------
  let current = null;
  function openClue(c, r) {
    const cat = game.categories[c], clue = cat.clues[r];
    const dd = isDD(c, r);
    current = { c, r, value: VALUES[r] * (dd ? 2 : 1), step: dd ? 'dd' : 'question' };
    used.add(c + '-' + r); saveUsed();
    $('clueCat').textContent = cat.name;
    $('clueVal').textContent = dd ? `Daily Double · ${current.value} pts` : VALUES[r];
    $('clueQ').textContent = clue.q || '(No question written yet)';
    $('clueA').textContent = clue.a || '(No answer written yet)';
    if (clue.img) $('clueImg').src = clue.img; else $('clueImg').removeAttribute('src');
    document.querySelector('.clue-body').classList.toggle('has-img', !!clue.img);
    $('clueView').classList.remove('hidden');
    renderStep();
  }
  function renderStep() {
    if (document.activeElement) document.activeElement.blur();   // so Space never double-fires a focused button
    const s = current.step;
    $('ddSplash').classList.toggle('hidden', s !== 'dd');
    $('clueQ').classList.toggle('hidden', s === 'dd');
    $('clueImg').classList.toggle('hidden', s === 'dd' || !$('clueImg').getAttribute('src'));
    $('clueA').classList.toggle('hidden', s !== 'answer');
    $('nextBtn').classList.toggle('hidden', s === 'answer');
    $('nextBtn').textContent = s === 'dd' ? 'Show question' : 'Reveal answer';
    renderAward();
  }
  function renderAward() {
    const a = $('award'); a.innerHTML = '';
    const show = current.step === 'answer' && players.length > 0;
    a.classList.toggle('hidden', !show);
    if (!show) return;
    const label = document.createElement('span'); label.className = 'label'; label.textContent = `Who got it? +${current.value}:`;
    a.appendChild(label);
    players.forEach(p => {
      const btn = document.createElement('button'); btn.textContent = p.name;
      btn.onclick = () => { p.score += current.value; savePlayers(); closeClue(); };
      a.appendChild(btn);
    });
  }
  function next() {
    if (!current) return;
    if (current.step === 'dd') current.step = 'question';
    else if (current.step === 'question') current.step = 'answer';
    renderStep();
  }
  function closeClue() { current = null; $('clueView').classList.add('hidden'); renderBoard(); }
  $('nextBtn').onclick = next;
  $('backBtn').onclick = closeClue;

  document.addEventListener('keydown', e => {
    if (!$('editView').classList.contains('hidden') || !$('scoresView').classList.contains('hidden')) {
      if (e.key === 'Escape') { closeOverlays(); }
      return;
    }
    if (!current) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); next(); }
    else if (e.key === 'Escape') closeClue();
  });

  $('resetBoardBtn').onclick = () => {
    if (!confirm('Reset the board so every question is available again? (Scores are kept.)')) return;
    used.clear(); saveUsed(); renderBoard();
  };

  // ---------- Scores ----------
  function renderPlayers() {
    const list = $('playerList'); list.innerHTML = '';
    if (!players.length) { const li = document.createElement('li'); li.innerHTML = '<span class="hint">No players yet. Scores are optional.</span>'; list.appendChild(li); }
    sortedPlayers().forEach((p, i) => {
      const li = document.createElement('li');
      const rank = document.createElement('span'); rank.className = 'rank'; rank.textContent = i + 1;
      const name = document.createElement('span'); name.className = 'name'; name.textContent = p.name;
      const pts = document.createElement('span'); pts.className = 'pts'; pts.textContent = p.score;
      const minus = document.createElement('button'); minus.className = 'ghost'; minus.textContent = '−100';
      minus.onclick = () => { p.score -= 100; savePlayers(); renderPlayers(); };
      const plus = document.createElement('button'); plus.className = 'ghost'; plus.textContent = '+100';
      plus.onclick = () => { p.score += 100; savePlayers(); renderPlayers(); };
      const del = document.createElement('button'); del.className = 'danger'; del.textContent = '✕';
      del.title = 'Remove player';
      del.onclick = () => { if (confirm(`Remove ${p.name}?`)) { players = players.filter(x => x !== p); savePlayers(); renderPlayers(); } };
      li.append(rank, name, pts, minus, plus, del);
      list.appendChild(li);
    });
    $('showStrip').checked = showStrip;
  }
  const addPlayer = () => {
    const name = $('newPlayer').value.trim();
    if (!name) return;
    players.push({ name, score: 0 }); savePlayers();
    $('newPlayer').value = ''; $('newPlayer').focus(); renderPlayers();
  };
  $('addPlayerBtn').onclick = addPlayer;
  $('newPlayer').onkeydown = e => { if (e.key === 'Enter') addPlayer(); };
  $('showStrip').onchange = e => { showStrip = e.target.checked; store.set('bbj-strip', showStrip); };
  $('resetScoresBtn').onclick = () => {
    if (!confirm('Set every player\'s score back to 0?')) return;
    players.forEach(p => p.score = 0); savePlayers(); renderPlayers();
  };
  $('scoresBtn').onclick = () => { renderPlayers(); $('scoresView').classList.remove('hidden'); $('newPlayer').focus(); };
  $('scoresClose').onclick = closeOverlays;
  function closeOverlays() { $('scoresView').classList.add('hidden'); $('editView').classList.add('hidden'); renderBoard(); }

  // ---------- Editor ----------
  let draft = null;
  function openEditor() { draft = clone(game); renderEditor(); $('edMsg').textContent = ''; $('editView').classList.remove('hidden'); }
  function renderEditor() {
    $('edTitle').value = draft.title || '';
    const grid = $('edGrid'); grid.innerHTML = '';
    draft.categories.forEach((cat, c) => {
      const box = document.createElement('div'); box.className = 'ed-cat';
      const name = document.createElement('input'); name.value = cat.name; name.placeholder = `Category ${c + 1}`;
      name.oninput = () => cat.name = name.value;
      box.appendChild(name);
      cat.clues.forEach((clue, r) => {
        const row = document.createElement('div'); row.className = 'ed-clue';
        const top = document.createElement('div'); top.className = 'top';
        const v = document.createElement('b'); v.textContent = VALUES[r];
        const ddLabel = document.createElement('label');
        const dd = document.createElement('input'); dd.type = 'radio'; dd.name = 'dd';
        dd.checked = !!draft.dailyDouble && draft.dailyDouble.c === c && draft.dailyDouble.r === r;
        dd.onchange = () => { draft.dailyDouble = { c, r }; };
        ddLabel.append(dd, 'Daily Double');
        top.append(v, ddLabel);
        const q = document.createElement('textarea'); q.value = clue.q; q.placeholder = 'Question';
        q.oninput = () => clue.q = q.value;
        const a = document.createElement('input'); a.value = clue.a; a.placeholder = 'Answer';
        a.oninput = () => clue.a = a.value;
        const img = document.createElement('input'); img.value = clue.img || '';
        img.placeholder = 'Picture link (optional)'; img.style.marginTop = '6px'; img.style.fontSize = '13px';
        img.oninput = () => { if (img.value.trim()) clue.img = img.value.trim(); else delete clue.img; };
        row.append(top, q, a, img);
        box.appendChild(row);
      });
      grid.appendChild(box);
    });
  }
  $('edTitle').oninput = () => { draft.title = $('edTitle').value; };
  $('editBtn').onclick = openEditor;
  $('editClose').onclick = closeOverlays;
  $('randomDdBtn').onclick = () => {
    // Avoid the 100 row so the Daily Double is worth wagering for
    draft.dailyDouble = { c: Math.floor(Math.random() * draft.categories.length), r: 1 + Math.floor(Math.random() * (VALUES.length - 1)) };
    renderEditor();
    $('edMsg').textContent = `Daily Double moved to ${draft.categories[draft.dailyDouble.c].name || 'category ' + (draft.dailyDouble.c + 1)} for ${VALUES[draft.dailyDouble.r]}. Click Save to keep it.`;
  };
  $('saveBtn').onclick = () => {
    game = clone(draft); store.set('bbj-game', game);
    $('edMsg').textContent = 'Saved!';
    setTimeout(closeOverlays, 500);
  };
  SETS.forEach((s, i) => { const o = document.createElement('option'); o.value = i; o.textContent = s.name; $('setSel').appendChild(o); });
  $('sampleBtn').onclick = () => {
    const set = SETS[+$('setSel').value];
    if (!confirm(`Replace all questions with "${set.name}"? Download a copy first if you want to keep yours.`)) return;
    draft = clone(set.data); renderEditor(); $('edMsg').textContent = `"${set.name}" loaded. Click Save to use it.`;
  };
  $('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(draft, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (draft.title || 'jeopardy').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.categories) || data.categories.length !== N_CATS ||
          data.categories.some(c => !Array.isArray(c.clues) || c.clues.length !== VALUES.length)) throw new Error('shape');
      draft = data; renderEditor();
      $('edMsg').textContent = 'File loaded. Click Save to use these questions.';
    } catch { alert('That file doesn\'t look like a Big Bang Jeopardy questions file.'); }
  };

  renderBoard();
})();
</script>
</body>
</html>
